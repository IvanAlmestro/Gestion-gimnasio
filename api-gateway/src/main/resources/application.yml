server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: ms-personas
            uri: http://localhost:8080
            predicates:
              - Path=/personas/**

          - id: ms-rutinas
            uri: http://localhost:8081
            predicates:
              - Path=/rutinas/**, /ejercicios/**

